<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dosya bulunamadı | Veinstone Studios</title>
  <meta name="robots" content="noindex">
  <script>
    /* Kısa wiki adresleri: /wiki/Henry_Edaven  ->  /wiki/?page=Henry_Edaven
       GitHub Pages eksik her adres için bu dosyayı sunar; bu yüzden wiki
       madde adresleri hata gösterilmeden önce wiki uygulamasına yönlendirilir. */
    (function () {
      var m = location.pathname.match(/^(.*\/wiki)\/(?:wiki\/)?([^\/][^\/.]*(?:\.[^\/]*)?)\/?$/);
      if (m && !/\.(html?|js|css|md|png|jpe?g|gif|webp|svg|otf|woff2?)$/i.test(m[2])) {
        location.replace(m[1] + '/?page=' + m[2] + location.hash);
      }
    })();
  </script>
  <link rel="icon" href="/wiki/assets/img/favicon.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --paper:#121110; --paper-2:#1b1917; --ink:#e7e0d1; --ink-3:#8c8476; --rule:#3b3631; --red:#b94a3c; --bar:#0b0a09; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
      background: var(--paper); color: var(--ink); font: 16px/1.6 'IBM Plex Sans', system-ui, sans-serif; }
    body::after { content: ''; position: fixed; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(to bottom, rgba(0,0,0,.09) 0 1px, transparent 1px 3px); }
    .sheet { background: var(--paper-2); border: 1px solid var(--rule); max-width: 560px; width: 100%; padding: 30px 30px 26px; text-align: center;
      box-shadow: 0 2px 12px rgba(0,0,0,.4); border-top: 4px solid var(--red); }
    .strip { display: flex; justify-content: space-between; font: 500 11px 'IBM Plex Mono', monospace; letter-spacing: .16em; text-transform: uppercase;
      color: var(--red); border-bottom: 1px dashed var(--rule); padding-bottom: 6px; margin-bottom: 22px; }
    .strip span:last-child { color: var(--ink-3); }
    .stamp { display: inline-block; font: 600 26px 'IBM Plex Mono', monospace; letter-spacing: .2em; color: var(--red);
      border: 4px double var(--red); padding: 8px 18px; transform: rotate(-4deg); margin: 4px 0 20px; opacity: .85; }
    h1 { font: 600 22px/1.3 'IBM Plex Sans', sans-serif; margin: 0 0 8px; }
    p { margin: 0 0 14px; color: #bfb6a5; }
    code { font: 13px 'IBM Plex Mono', monospace; background: #252220; color: #e7e0d1; padding: 1px 6px; word-break: break-all; }
    .links { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
    .links a { background: #252220; border: 1px solid var(--rule); color: #e6dfcf; text-decoration: none; padding: 9px 16px;
      font: 600 12px 'IBM Plex Mono', monospace; letter-spacing: .12em; text-transform: uppercase; }
    .links a:hover { background: var(--red); }
  </style>
</head>
<body>
  <main class="sheet">
    <div class="strip"><span>Hata 404</span><span>Kayıt eksik</span></div>
    <div class="stamp">DOSYA BULUNAMADI</div>
    <h1>İstenen kayıt mevcut değil.</h1>
    <p><code id="path"></code> adresinde kayıtlı bir dosya yok. Taşınmış, yeniden adlandırılmış ya da hiç var olmamış olabilir.</p>
    <div class="links">
      <a href="/wiki/" lang="en">The Facility Wiki</a>
      <a href="/" lang="en">Veinstone Studios</a>
    </div>
  </main>
  <script>document.getElementById('path').textContent = location.pathname;</script>
</body>
</html>
