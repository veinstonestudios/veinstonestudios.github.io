name: Wiki önerisi
description: The Facility Wiki'deki bir karakter, plot veya dünya konusu için öneri gönder.
title: "[Öneri] "
body:
  - type: markdown
    attributes:
      value: |
        **Öneriler kanon değildir.** Gönderdiğin fikir yalnızca değerlendirilmek üzere kaydedilir.
        Proje sorumlusu onaylamadan wikideki *Kesinleştirildi* bilgileri değişmez.

        Başlığı `[Öneri] [İlgili sayfa] Kısa başlık` biçiminde bırak; örn. `[Öneri] [Henry Edaven] Stres altındaki davranışları`.
  - type: input
    id: konu
    attributes:
      label: İlgili karakter / konu
      description: Önerinin ilgili olduğu wiki sayfasının adı (ör. Henry Edaven, Facility 60, Sonlar).
      placeholder: Henry Edaven
    validations:
      required: true
  - type: dropdown
    id: tur
    attributes:
      label: Öneri türü
      options:
        - A — Mevcut bir özelliği geliştirme
        - B — Henüz karar verilmemiş bir konuya öneri
    validations:
      required: true
  - type: textarea
    id: aciklama
    attributes:
      label: Önerinin açıklaması
      description: Fikrini olabildiğince açık yaz. Neyi neden önerdiğini belirt.
    validations:
      required: true
  - type: input
    id: oneren
    attributes:
      label: Öneriyi sunan kişi
      description: Adın veya ekipteki rolün.
    validations:
      required: true
